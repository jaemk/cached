[package]
name = "wasm"
version = "0.1.0"
edition = "2024"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies.cached]
path = "../.."
default-features = false
features = ["proc_macro", "async", "time_stores"]

[dependencies.gloo-net]
version = "0.8"
default-features = false
features = ["http"]

[dependencies.js-sys]
version = "0.3"

[dependencies.wasm-bindgen-futures]
version = "0.4"

[dependencies.yew]
version = "0.23"
features = ["csr"]
